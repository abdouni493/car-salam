<!doctype html>
<html lang="en" data-surface="admin">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Le thème du back-office AVANT le premier pixel : appliqué par React, la
      // page clignoterait en blanc à chaque rechargement avant de virer au noir.
      // Carbone par défaut : on ne retombe en clair que si l'utilisateur l'a
      // explicitement choisi via le bouton de la navbar.
      try {
        document.documentElement.dataset.adminTheme =
          localStorage.getItem('salam:admin-theme') === 'light' ? 'light' : 'carbon';
      } catch (e) {
        document.documentElement.dataset.adminTheme = 'carbon';
      }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <script>
      // Nom et logo de l'agence (Paramètres) dès le premier rendu : relus depuis
      // le cache écrit par src/utils/branding.ts, puis rafraîchis depuis la base.
      try {
        var b = JSON.parse(localStorage.getItem('salam:branding') || 'null');
        if (b && b.name) document.title = b.name;
        if (b && b.icon) {
          ['icon', 'apple-touch-icon'].forEach(function (rel) {
            var l = document.createElement('link');
            l.rel = rel;
            l.href = b.icon;
            document.head.appendChild(l);
          });
        }
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,300&family=Barlow:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&family=Barlow+Condensed:wght@600;700;800;900&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
